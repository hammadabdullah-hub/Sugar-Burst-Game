name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 requires Node 22+ and JDK 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      # THE FIX: adds the AdMob APPLICATION_ID to the manifest. Without it the Google Mobile
      # Ads SDK crashes the app at launch. Optional: set a repository variable ADMOB_APP_ID
      # (Settings > Secrets and variables > Actions > Variables) to use your real AdMob app id;
      # otherwise Google's sample app id is used.
      - name: Patch Android manifest (AdMob app id)
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sugar-burst-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
